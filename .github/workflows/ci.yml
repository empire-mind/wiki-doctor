name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest tests/ -q
      - name: template wiki must be CLEAN
        run: python wiki-doctor.py template
      - name: demo wiki must fire all three finding classes (exit 1 by design)
        run: |
          if python wiki-doctor.py examples/my-wiki; then
            echo "demo wiki should report problems" && exit 1
          fi
